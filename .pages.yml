# Pages CMS 配置（https://app.pagescms.org/）
# 仓库根目录放这个文件，Pages CMS 会自动识别。
# 改动会直接以 commit 形式提交到 GitHub，由部署平台自动触发构建。

# ---------- 全局设置 ----------
# 开启后可用 Cache 页（/owner/repo/branch/cache）手动同步字段表：
# 只有该页面会拿 GitHub 上的 .pages.yml 与数据库缓存比对，否则改了字段表可能不生效。
settings:
  cache: true

# ---------- 媒体库：文章图片 ----------
# 注意：Pages CMS 的媒体目录是固定路径，不支持按文章自动分子文件夹；
# 统一存到 src/content/posts/images，上传时会自动把文件名转成 slug 避免互相覆盖。
# output 写相对路径 images/，正文里生成 ![](images/xxx.jpg)，
# 主题会按「文章同级目录」解析，构建后自动转成 /_astro/... 优化图。
media:
  - name: post-images
    label: 文章图片
    input: src/content/posts/images
    output: images
    # 打开媒体浏览器 / 插入图片弹窗时，默认定位到这个目录
    path: src/content/posts/images
    categories: [image]
    rename: safe

  - name: site-images
    label: 站点图片（banner / 头像 / favicon）
    input: public/images/site
    output: /images/site
    categories: [image]
    rename: safe

# ---------- 内容：文章 ----------
content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    # 新建文章时可以自定义文件名（如 yx-xxx.md），默认用标题
    filename:
      template: "{primary}.md"
      field: create
    exclude: ["images"]
    view:
      primary: title
      fields: [title, published, draft, pinned]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      # ---------- 下载资源（表单化，替代手写 ::download{...}） ----------
      # 一行一个网盘，竖线分隔：名称 | 链接 | 提取码 | 访问密码 | 文件大小
      # 构建时自动在正文最上方生成下载卡片，与手写 ::download{} 完全一致。
      # 正文里已经手写过指令的文章以正文为准，这里会被忽略。
      - name: downloadLinks
        label: 下载资源（一行一个网盘，多个网盘换行多写几条）
        type: text
        optional: true
        description: |-
          每行一条，用竖线 | 分隔，顺序固定：名称 | 链接 | 提取码 | 访问密码 | 文件大小。
          第 3 段是提取码，第 4 段是访问密码，位置不能省；没有的那一段留空，但竖线要保留。
          有提取码 + 访问密码：
          【百度网盘】大话西游2单机版 | https://pan.baidu.com/s/xxxx | 1wau | 66398
          只有访问密码、没有提取码（中间空一段）：
          【蓝奏云】JoePay 插件 | https://8x8.lanzout.com/xxxx | | 88386
          免费直下、无任何码：
          【夸克网盘】大话西游2单机版 | https://pan.quark.cn/s/xxxx
          整行不要用【】包起来——【】只用来包住开头的网盘名。
          网盘类型与卡片封面会自动识别，不用填。

      - name: downloadHint
        label: 下载密码获取方式（可选）
        type: string
        optional: true
        description: "读者点下载时会看到这句话，例如：邮箱 golooo@qq.com。留空则显示「请联系作者获取」"

      - name: description
        label: 简介（列表页摘要 / SEO 描述）
        type: text
        optional: true

      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updated
        label: 更新日期（留空则不显示）
        type: date
        optional: true
        options:
          format: yyyy-MM-dd

      - name: tags
        label: 标签（回车添加多个）
        type: string
        list: true
        optional: true

      - name: category
        label: 分类（回车添加多个；二级分类用「父/子」写法，如 游戏资源/动作冒险）
        type: string
        list: true
        optional: true

      - name: kind
        label: 列表类型徽章（留空 = 自动判断：有 password 算加密，否则算免费）
        type: select
        optional: true
        options:
          values:
            - label: 免费资源（绿）
              value: free
            - label: 加密资源（红）
              value: locked
            - label: 资讯博文（紫）
              value: news
            - label: 开源项目（黑）
              value: oss

      - name: image
        label: 封面图（留空 = 用正文第一张图，正文也没图则用随机封面 API）
        type: image
        optional: true

      - name: keywords
        label: 关键词（SEO，逗号分隔或逐条添加）
        type: string
        list: true
        optional: true

      - name: author
        label: 作者（留空用站点默认作者）
        type: string
        optional: true

      - name: series
        label: 系列名称（留空表示不属于任何系列）
        type: string
        optional: true

      - name: seriesOrder
        label: 系列内排序（数字越小越靠前）
        type: number
        optional: true
        default: 0

      - name: ogImage
        # 图片请先上传到「站点图片」或 public/images，再填 /images/xxx.avif；
        # 构建时会自动拼成 https://www.3x3.top/images/xxx.avif 同域名绝对地址。
        # 留空则自动使用站点默认分享图，不要填 raw.githubusercontent.com 等外部图床。
        label: 社交分享图 OG Image（推荐 /images/xxx.avif）
        type: string
        optional: true

      - name: draft
        label: 草稿（开启后不在站点显示）
        type: boolean
        default: false

      - name: pinned
        label: 置顶
        type: boolean
        default: false

      - name: comment
        label: 开启评论
        type: boolean
        default: true

      - name: body
        label: 正文
        description: "插图片：在空行输入斜杠 / 选 Image，从媒体库选图；或直接把图片拖进编辑区、Ctrl+V 粘贴。路径自动写好。格式化工具条要先选中文字才会浮出来（粗体/斜体/链接/标题级别都在那里）。章节之间不要用 ---- 长横线分隔（Markdown 会把它当成标题下划线，把上一段变成大标题），需要分隔线请写三个星号 ***。"
        type: rich-text
        options:
          format: markdown
          # 默认是所见即所得编辑器；::btn / ::video / ::download / ::gallery
          # 这类自定义指令请点右上角切换到「Source / 源码」模式编辑
          switcher: true
          # 插入图片时用哪个媒体库（决定正文里写入的地址前缀）
          media: post-images
          # 上传目录：Pages CMS 这里要写**完整仓库路径**，
          # 文件会存到 src/content/posts/images/xxx.png，
          # 正文里写入的却是相对路径 ![](images/xxx.png)，
          # 主题按「文章同级目录」解析，构建时自动转成 AVIF 优化图。
          path: src/content/posts/images
          extensions: [avif, webp, jpg, jpeg, png, gif]
          rename: safe

  # ---------- 站点设置 ----------
  # 这些文件是站点配置的唯一数据源，src/config.ts 会读取它们并与内置默认值合并，
  # 所以某一项被清空时会自动回退默认值，不会把站点改崩。
  - name: site-settings
    label: 站点设置
    type: group
    items:
      - name: site-info
        label: 站点信息
        type: file
        path: src/data/site.json
        format: json
        fields:
          - name: title
            label: 站点名称（导航栏与标题）
            type: string
            required: true

          - name: description
            label: 站点简介（首页与 SEO 描述）
            type: text

          - name: homeLayout
            label: 首页版式
            type: select
            options:
              values:
                - value: grid
                  label: 卡片网格（封面图，适合图片资源站）
                - value: list
                  label: 列表（文字条目，适合教程资讯为主）
            description: "切换后重新构建生效。网格显示封面图与类型角标，列表只显示文字条目。"

          - name: keywords
            label: 站点关键词（SEO，逗号分隔）
            type: text

          - name: lang
            label: 站点语言
            type: select
            options:
              values:
                - zh_CN
                - zh_TW
                - en
                - ja
                - ko
                - es
                - th
                - vi
                - tr
                - id

          - name: logo
            label: 站点 Logo（导航栏左侧图片，留空则显示默认房子图标）
            type: image
            options:
              media: site-images

          - name: themeColor
            label: 主题色
            type: object
            fields:
              - name: hue
                label: 色相（0-360）
                type: number
              - name: fixed
                label: 锁定色相（访客不可调）
                type: boolean

          - name: banner
            label: 顶部横幅
            type: object
            fields:
              - name: enable
                label: 显示横幅
                type: boolean
              - name: src
                label: 横幅图片
                type: image
                options:
                  media: site-images
              - name: position
                label: 取景位置
                type: select
                options:
                  values: [top, center, bottom]
              - name: credit
                label: 版权信息
                type: object
                fields:
                  - name: enable
                    label: 显示版权
                    type: boolean
                  - name: text
                    label: 版权文字
                    type: string
                  - name: url
                    label: 版权链接
                    type: string

          - name: toc
            label: 文章目录
            type: object
            fields:
              - name: enable
                label: 显示目录
                type: boolean
              - name: depth
                label: 目录层级（1-3）
                type: number

          - name: favicon
            label: 站点图标
            type: object
            list: true
            fields:
              - name: src
                label: 图标文件
                type: image
                options:
                  media: site-images
              - name: theme
                label: 主题
                type: select
                options:
                  values: [light, dark]
              - name: sizes
                label: 尺寸
                type: string

          - name: license
            label: 文章许可证
            type: object
            fields:
              - name: enable
                label: 显示许可证
                type: boolean
              - name: name
                label: 许可证名称
                type: string
              - name: url
                label: 许可证链接
                type: string

          - name: codeTheme
            label: 代码块主题
            type: select
            options:
              values:
                - github-dark
                - github-dark-dimmed
                - vitesse-dark
                - material-theme-palenight

      - name: nav-links
        label: 导航栏链接
        type: file
        path: src/data/nav.json
        format: json
        list: true
        fields:
          - name: name
            label: 名称
            type: string
            description: "一级导航直接写名称，例如：论坛。要放进某个下拉里就写成「资源/网站资源」——斜杠前是一级项名称，斜杠后是下拉里显示的文字"
          - name: url
            label: 链接
            type: string
            description: "首页填 /，归档填 /archive/，关于填 /about/；想让它只作下拉分组标题就留空"
          - name: external
            label: 站外链接
            type: boolean
            description: "指向外部网站时打开"
          - name: parent
            label: 上级导航（留空 = 一级导航）
            type: string
            description: "要作为某个一级项的下拉子项时，这里填那个一级项的名称，例如：资源。留空就是一级导航"

      - name: profile
        label: 侧边栏资料
        type: file
        path: src/data/profile.json
        format: json
        fields:
          - name: title
            label: 资料卡标题
            type: string
          - name: avatar
            label: 头像
            type: image
            options:
              media: site-images
          - name: name
            label: 昵称
            type: string
          - name: bio
            label: 个性签名
            type: text
          - name: icp
            label: ICP 备案号
            type: string
          - name: links
            label: 社交链接
            type: object
            list: true
            fields:
              - name: name
                label: 名称
                type: string
              - name: icon
                label: 图标（Iconify 名称，如 fa6-brands:github）
                type: string
              - name: url
                label: 链接
                type: string

      - name: friends
        label: 友情链接
        type: file
        path: src/data/friends.json
        format: json
        list: true
        fields:
          - name: name
            label: 站点名称
            type: string
          - name: url
            label: 站点地址
            type: string
          - name: avatar
            label: 头像地址
            type: string
          - name: description
            label: 站点简介
            type: text
